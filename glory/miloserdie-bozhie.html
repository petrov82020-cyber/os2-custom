<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Милость Божья — Практика славословия</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="hymn">
    <header class="hymn__header">
      <a href="../" class="hymn__back">← К каталогу</a>
      <h1 class="hymn__title">Милость Божья</h1>
    </header>

    <article class="hymn__body">
      <section class="hymn__verse">
        <p>Славьте Создателя,</p>
        <p>Славьте Творца,</p>
        <p>Нашего Великого,</p>
        <p>Небесного Отца,</p>
      </section>

      <section class="hymn__verse">
        <p>Который, по милости Своей Превеликой,</p>
        <p>Избавил нас от смерти</p>
        <p>И власти греха!</p>
      </section>

      <section class="hymn__verse">
        <p>Дабы мы возвещали совершенство</p>
        <p>Призвавшего нас</p>
        <p>В Царство Сына Своего</p>
        <p>Иисуса Христа!</p>
      </section>
    </article>
  </main>
</body>
</html>
