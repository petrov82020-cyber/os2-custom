    border: 1px solid #bbb;
    background: #fff;
    border-radius: 6px;
    font: inherit;
    font-size: 1.02rem;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .6rem;
  }
  .opt:hover:not(:disabled) { background: #f0f5ff; border-color: #88a; }
  .opt:disabled { cursor: default; }
  .opt.correct {
    background: #e6f7ea;
    border-color: #3a9a4e;
  }
  .opt.wrong {
    background: #fdecea;
    border-color: #c0392b;
  }
  .opt .label { flex: 1; }
  .opt[dir="rtl"] .label { direction: rtl; }
  .opt .mark {
    font-size: 1.3em;
    min-width: 1.2em;
    text-align: center;
    font-weight: bold;

  .opt.correct .mark { color: #1e7a3a; }
  .opt.wrong .mark { color: #b03020; }
  .result {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 1.2rem 1.4rem;
    margin-top: 1rem;
  }
  .result .score { font-size: 2rem; font-weight: bold; margin: .3rem 0 .6rem; }
  .restart {
    margin-top: 1rem;
    padding: .6rem 1.1rem;
    font: inherit;
    background: #3a6ea5;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;

  .note { color: #666; font-size: .9em; margin-top: .6rem; }

/* ---------- Seeded RNG (mulberry32) from system clock ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = Date.now() >>> 0;
const rng = mulberry32(SEED);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    correct: 'Огласовка — средневековая интерпретация, а не прямое свидетельство произношения эпохи создания текста' }
];

/* ---------- Подготовка сессии ---------- */
const TOTAL = 20;
const indices = shuffle([...Array(BANK.length).keys()]).slice(0, TOTAL);
const SESSION = indices.map(i => {
  const q = BANK[i];
  const opts = q.options.map(text => ({ text, correct: text === q.correct }));
  return { q: q.q, options: shuffle(opts) };
});

/* ---------- Состояние ---------- */
let current = 0;
let score = 0;

const $progress = document.getElementById('progress');
const $tally = document.getElementById('tally');
const $barfill = document.getElementById('barfill');
const $question = document.getElementById('question');
const $options = document.getElementById('options');
const $stage = document.getElementById('stage');
const $final = document.getElementById('final');

function render() {
  const item = SESSION[current];
  $progress.textContent = `Вопрос ${current + 1} из ${TOTAL}`;
  $tally.textContent = `Правильно: ${score}`;
  $barfill.style.width = `${(current / TOTAL) * 100}%`;
  $question.innerHTML = item.q;
  $options.innerHTML = '';

  item.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    const isHeb = /[\u0590-\u05FF]/.test(opt.text);
    if (isHeb) btn.setAttribute('dir', 'rtl');
    btn.innerHTML = `<span class="label">${opt.text}</span><span class="mark"></span>`;
    btn.addEventListener('click', () => choose(btn, opt, item));
    $options.appendChild(btn);
  });
}

function choose(btn, opt, item) {
  const buttons = [...$options.querySelectorAll('.opt')];
  buttons.forEach(b => b.disabled = true);

  if (opt.correct) {
    btn.classList.add('correct');
    btn.querySelector('.mark').textContent = '✓';
    score++;
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.mark').textContent = '✗';
    buttons.forEach((b, i) => {
      if (item.options[i].correct) {
        b.classList.add('correct');
        b.querySelector('.mark').textContent = '✓';
      }
    });
  }

  $tally.textContent = `Правильно: ${score}`;

  setTimeout(() => {
    current++;
    if (current < TOTAL) {
      render();
    } else {
      finish();
    }
  }, 900);
}

function finish() {
  $barfill.style.width = '100%';
  $stage.style.display = 'none';
  const pct = Math.round((score / TOTAL) * 100);
  let verdict = '';
  if (pct >= 90) verdict = 'Отличный уровень: можно переходить к работе с текстами в оригинале.';
  else if (pct >= 70) verdict = 'Хороший уровень: есть база, но нужна систематическая проверка по текстам.';
  else if (pct >= 50) verdict = 'Средний уровень: повторите фонетику, состояния имён и породы.';
  else verdict = 'Начальный уровень: начните с алфавита, огласовки и базовой лексики.';
  $final.innerHTML = `
    <div>Тест завершён. Итог:</div>
    <div class="score">${score} / ${TOTAL}</div>
    <div>${pct}%</div>
    <p>${verdict}</p>
    <button class="restart" onclick="location.reload()">Пройти ещё раз (новый набор вопросов)</button>
    <p class="note">Порядок вопросов и вариантов определяется системным временем при загрузке страницы.</p>
  `;
  $final.style.display = 'block';
}

render();
</script>
