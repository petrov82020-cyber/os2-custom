<script>
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SEED = Date.now() >>> 0;
const rng = mulberry32(SEED);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- Подготовка сессии ---------- */
const TOTAL = 20;
const indices = shuffle([...Array(BANK.length).keys()]).slice(0, TOTAL);
const SESSION = indices.map(i => {
  const q = BANK[i];
  return { q: q.q, correct: q.correct, options: shuffle(q.options) };
});

/* ---------- Состояние ---------- */
let current = 0;
let score = 0;

const $progress = document.getElementById('progress');
const $tally = document.getElementById('tally');
const $barfill = document.getElementById('barfill');
const $question = document.getElementById('question');
const $options = document.getElementById('options');
const $stage = document.getElementById('stage');
const $final = document.getElementById('final');

function render() {
  const item = SESSION[current];
  $progress.textContent = `Вопрос ${current + 1} из ${TOTAL}`;
  $tally.textContent = `Правильно: ${score}`;
  $barfill.style.width = `${(current / TOTAL) * 100}%`;
  $question.innerHTML = item.q;
  $options.innerHTML = '';

  item.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    const isHeb = /[\u0590-\u05FF]/.test(opt);
    const labelDir = isHeb ? ' dir="rtl"' : '';
    btn.innerHTML = `<span class="label"${labelDir}>${opt}</span><span class="mark"></span>`;
    btn.addEventListener('click', () => choose(btn, opt, item));
    $options.appendChild(btn);
  });
}

function choose(btn, opt, item) {
  const buttons = [...$options.querySelectorAll('.opt')];
  buttons.forEach(b => b.disabled = true);

  if (opt === item.correct) {
    btn.classList.add('correct');
    btn.querySelector('.mark').textContent = '✓';
    score++;
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.mark').textContent = '✗';
    buttons.forEach(b => {
      if (b.querySelector('.label').innerHTML === item.correct) {
        b.classList.add('correct');
        b.querySelector('.mark').textContent = '✓';
      }
    });
  }

  $tally.textContent = `Правильно: ${score}`;

  setTimeout(() => {
    current++;
    if (current < TOTAL) {
      render();
    } else {
      finish();
    }
  }, 900);
}

function finish() {
  $barfill.style.width = '100%';
  $stage.style.display = 'none';
  const pct = Math.round((score / TOTAL) * 100);
  let verdict = '';
  if (pct >= 90) verdict = 'Отличный уровень: правила реконструкции и ограничения метода усвоены.';
  else if (pct >= 70) verdict = 'Хороший уровень: есть база, но нужно повторить семантические проверки.';
  else if (pct >= 50) verdict = 'Средний уровень: повторите части 15–20 и таблицу правил.';
  else verdict = 'Начальный уровень: вернитесь к синтезу серии (часть 20).';
  $final.innerHTML = `
    <div>Тест завершён. Итог:</div>
    <div class="score">${score} / ${TOTAL}</div>
    <div>${pct}%</div>
    <p>${verdict}</p>
    <button class="restart" onclick="location.reload()">Пройти ещё раз (новый набор вопросов)</button>
    <p class="note">Порядок вопросов и вариантов определяется системным временем при загрузке страницы.</p>
  `;
  $final.style.display = 'block';
}

render();
